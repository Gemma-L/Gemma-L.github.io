<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EVE — A Short Story by Zhuoman Li</title>
  <meta name="description" content="EVE, a science-fiction short story by Zhuoman Li.">
  <style>
    :root{--bg:#07080d;--ink:#e7eeee;--muted:#8da0a8;--cyan:#4cf3e0;--pink:#ff4f9a;--line:rgba(76,243,224,.2)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(rgba(76,243,224,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(76,243,224,.028) 1px,transparent 1px),var(--bg);background-size:48px 48px;color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.9}header{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:18px 5vw;border-bottom:1px solid var(--line);background:rgba(7,8,13,.9);backdrop-filter:blur(14px);font-family:"SFMono-Regular",Consolas,monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase}a{color:var(--cyan);text-decoration:none}main{width:min(760px,calc(100% - 42px));margin:auto;padding:90px 0 120px}.kicker{margin:0 0 18px;color:var(--pink);font-family:"SFMono-Regular",Consolas,monospace;font-size:9px;letter-spacing:.18em}h1{margin:0 0 18px;color:transparent;font-family:Arial Black,Arial,sans-serif;font-size:clamp(96px,20vw,190px);line-height:.72;letter-spacing:-.08em;-webkit-text-stroke:2px var(--pink);text-shadow:11px 11px 0 rgba(76,243,224,.1)}.byline{margin:35px 0 70px;color:var(--muted);font-family:"SFMono-Regular",Consolas,monospace;font-size:10px;letter-spacing:.15em;text-transform:uppercase}.story{font-size:19px}.story p{margin:0 0 1.55em}.story p:first-child{padding-left:22px;border-left:2px solid var(--cyan);color:#cbd7dc;font-style:italic}.loading{color:var(--muted);font-family:"SFMono-Regular",Consolas,monospace;font-size:11px}.end{margin-top:70px;text-align:center;color:var(--pink);font-family:"SFMono-Regular",Consolas,monospace;font-size:10px;letter-spacing:.25em}@media(max-width:600px){main{padding-top:65px}.story{font-size:17px}header{padding:16px 21px}}
  </style>
</head>
<body>
  <header><a href="index.html#scifi">← Back to portfolio</a><span>EVE // Zhuoman Li</span></header>
  <main><p class="kicker">SCI-FI_SHORT_STORY</p><h1>EVE</h1><p class="byline">Written by Zhuoman Li</p><article class="story" id="story"><p class="loading">Loading story…</p></article><p class="end">END_OF_FILE</p></main>
  <script>
    fetch('EVE.txt').then(response=>{if(!response.ok)throw new Error('Story unavailable');return response.text()}).then(text=>{const story=document.getElementById('story');story.textContent='';text.split(/\r?\n/).map(line=>line.trim()).filter(Boolean).forEach(line=>{const p=document.createElement('p');p.textContent=line;story.appendChild(p)})}).catch(()=>{document.getElementById('story').textContent='The story could not be loaded.'});
  </script>
</body>
</html>
